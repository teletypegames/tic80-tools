steps:
  - name: version
    image: alpine
    commands:
      - 'apk add --no-cache make'
      - 'make ci-version'

  - name: lint
    image: alpine
    commands:
      - 'apk add --no-cache make lua5.4 lua5.4-dev luarocks gcc musl-dev'
      - 'ln -sf /usr/bin/lua5.4 /usr/bin/lua'
      - 'ln -sf /usr/bin/luarocks-5.4 /usr/bin/luarocks'
      - 'luarocks install luacheck'
      - 'make ci-lint'

  - name: minify
    image: alpine
    commands:
      - 'apk add --no-cache make lua5.4 curl'
      - 'ln -sf /usr/bin/lua5.4 /usr/bin/lua'
      - 'make ci-minify'

  - name: docs
    image: alpine
    commands:
      - 'apk add --no-cache make lua5.4 lua5.4-dev luarocks gcc musl-dev zip'
      - 'ln -sf /usr/bin/lua5.4 /usr/bin/lua'
      - 'ln -sf /usr/bin/luarocks-5.4 /usr/bin/luarocks'
      - 'luarocks install ldoc'
      - 'make ci-docs'

  - name: export
    image: git.teletypegames.org/internal/tic80pro:latest
    environment:
      XDG_RUNTIME_DIR: /tmp
    commands:
      - 'make ci-export'

  - name: binaries
    image: git.teletypegames.org/internal/tic80pro:latest
    environment:
      XDG_RUNTIME_DIR: /tmp
    commands:
      - 'make ci-binaries'

  - name: artifact
    image: alpine
    environment:
      UPDATE_SERVER: https://teletypegames.org
      UPDATE_SECRET:
        from_secret: update_secret_key
    commands:
      - 'apk add --no-cache make curl'
      - 'make ci-artifact'

  - name: publish
    image: alpine
    environment:
      UPDATE_SERVER: https://teletypegames.org
      UPDATE_SECRET:
        from_secret: update_secret_key
    commands:
      - 'apk add --no-cache make curl'
      - 'make ci-publish'
